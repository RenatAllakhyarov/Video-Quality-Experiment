[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-quality-experiment"
version = "0.1.0"
description = "Reproducible PSNR/SSIM/VMAF preprocessing and codec experiment"
requires-python = ">=3.11"

[project.scripts]
video-quality = "video_quality.cli:main"

[tool.setuptools]
packages = ["video_quality"]
